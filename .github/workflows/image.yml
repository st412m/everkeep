name: image

# Builds and publishes ghcr.io/st412m/everkeep for a version tag (v1.2.3):
# tags 1.2.3, 1.2 and latest, for linux/amd64 and linux/arm64. The image
# installs everkeep from npm (the default build of the Dockerfile).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${v}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${v}" >&2
            exit 1
          fi
      # One version in package.json, CHANGELOG, the Dockerfile pin, server.json
      # and compose.example.yaml.
      - name: Release consistency
        run: node tools/check-release.mjs
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest is added for a release tag (not for 1.2.3-rc.1).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
