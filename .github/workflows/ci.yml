name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The test matrix. Entries marked full run only in st412m/everkeep; the rest
  # run on every push, in any copy of the repository.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          FULL: ${{ github.repository == 'st412m/everkeep' }}
        run: |
          node -e '
            const all = [
              { os: "ubuntu-latest", node: 22 },
              { os: "ubuntu-latest", node: 24 },
              { os: "windows-latest", node: 24 },
              { os: "macos-latest", node: 24 },
              { os: "windows-latest", node: 22, full: true },
              { os: "macos-latest", node: 22, full: true },
              { os: "macos-15-intel", node: 24, full: true },
            ];
            const pick = all.filter(e => process.env.FULL === "true" || !e.full).map(e => ({ os: e.os, node: e.node }));
            console.log("include=" + JSON.stringify(pick));
          ' >> "$GITHUB_OUTPUT"

  test:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=optional
      - name: Syntax check
        run: for f in src/*.js; do node --check "$f"; done
      # APFS and NTFS ignore case by default: the case-insensitive tests run
      # there in a folder on the runner's own disk.
      - name: Case-insensitive test folder
        if: runner.os != 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/ci-mount"
          echo "EVERKEEP_TEST_CI_MOUNT=$RUNNER_TEMP/ci-mount" >> "$GITHUB_ENV"
      # Temp folders on macOS go to a case-sensitive APFS volume, as on Linux:
      # the tests that assume a case-sensitive temp folder run there, the
      # case-insensitive ones in the folder above.
      - name: Case-sensitive temp folder
        if: runner.os == 'macOS'
        run: |
          hdiutil create -size 2g -fs "Case-sensitive APFS" -volname everkeep-cs -type SPARSE "$RUNNER_TEMP/cs.sparseimage"
          hdiutil attach "$RUNNER_TEMP/cs.sparseimage" -mountpoint "$RUNNER_TEMP/cs"
          touch "$RUNNER_TEMP/cs/probe"
          if [ -e "$RUNNER_TEMP/cs/PROBE" ]; then echo "the volume ignores case"; exit 1; fi
          rm "$RUNNER_TEMP/cs/probe"
          echo "TMPDIR=$RUNNER_TEMP/cs" >> "$GITHUB_ENV"
      # macOS has no poppler, and the sqlite3 it ships (/usr/bin, 3.51.0 on
      # macOS 26.7) does not take PRAGMA hard_heap_limit (the echo is 0), so
      # sqlite_query would refuse with HEAP_LIMIT_UNCONFIRMED. Homebrew's
      # sqlite is keg-only: its bin goes first on PATH, as the install docs
      # tell users to do. The runner's Android SDK has a sqlite3 of its own on
      # PATH as well; the smoke line prints which one ran.
      - name: External tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install sqlite poppler
          SQLITE_BIN_DIR="$(brew --prefix sqlite)/bin"
          sw_vers
          /usr/bin/sqlite3 -version
          "$SQLITE_BIN_DIR/sqlite3" -version
          PATH="$SQLITE_BIN_DIR:$PATH" which -a sqlite3 pdfinfo pdftoppm
          PATH="$SQLITE_BIN_DIR:$PATH" sh scripts/toolchain-check.sh smoke
      # The glob is quoted: node expands it itself.
      - name: Tests
        run: node --test "test/*.test.js"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=optional
      # shellcheck comes with the runner image (0.9.0 on ubuntu-24.04). SC2015
      # ("A && B || C is not if-then-else") is excluded: the script means "fail
      # unless both tests pass"; shellcheck 0.11.0 no longer reports it there.
      - name: Shell
        run: shellcheck -e SC2015 scripts/toolchain-check.sh
      - name: YAML
        run: >-
          pipx run yamllint==1.38.0 --strict
          -d "{extends: default, rules: {document-start: disable,
          line-length: {max: 160}, truthy: {check-keys: false}}}"
          compose.example.yaml .github/workflows/ci.yml .github/workflows/image.yml .github/workflows/mcpb.yml
      - name: Documentation examples
        run: node tools/check-doc-examples.mjs
      - name: Secret scan
        run: node tools/scan-secrets.mjs
      # One version in package.json, CHANGELOG, the Dockerfile pin, server.json,
      # compose.example.yaml and manifest.json; server.json limits; the
      # manifest's tools = the server's tools; icon.png 512×512.
      - name: Release consistency
        run: node tools/check-release.mjs
      # The Claude Desktop extension manifest; the CLI version is pinned in
      # tools/pack-mcpb.mjs.
      - name: MCPB manifest
        run: npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
      # The package holds src/, scripts/, everkeep.example.json, README.md,
      # CHANGELOG.md, LICENSE and package.json, nothing else.
      - name: Package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map(f => f.path);
            const ok = /^(src\/[^/]+\.js|scripts\/toolchain-check\.sh|everkeep\.example\.json|README\.md|CHANGELOG\.md|LICENSE|package\.json)$/;
            const bad = files.filter(f => !ok.test(f));
            if (bad.length) { console.error("unexpected in the package:", bad.join(", ")); process.exit(1); }
            console.log(files.length + " files in the package");
          '
